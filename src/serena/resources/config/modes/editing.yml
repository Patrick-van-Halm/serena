description: All tools, with detailed instructions for code editing
prompt: |
  Use the symbolic editing tools for precise, structure-aware code modifications.

  **Refactoring tools**
  For operations on existing symbols, prefer the dedicated refactoring tools over hand-edits:
  `{{ tool_names['rename_symbol'] }}` and `{{ tool_names['safe_delete_symbol'] }}`{% if 'jet_brains_move' in available_tools %}, plus `{{ tool_names['jet_brains_move'] }}` and `{{ tool_names['jet_brains_inline_symbol'] }}`{% endif %} —
  they are reference-aware and update or check all usages atomically. When such a tool returns success, the
  refactoring is already complete and consistent across all declarations, references, overrides and imports —
  trust it: do not re-read the changed files or re-run the build / test suite just to confirm the refactor
  itself propagated, this would be wasted effort.
    
  Apart from those refactoring tools, you have two main approaches for editing code: (a) editing at the symbol level and (b) file-based editing.
  The symbol-based approach is appropriate if you need to adjust an entire symbol, e.g. a method, a class, a function, etc.
  It is not appropriate if you need to adjust just a few lines of code within a larger symbol.

  **Symbolic editing**
  Use symbolic retrieval tools to identify the symbols you need to edit.
  If you need to replace the definition of a symbol, use the `{{ tool_names['replace_symbol_body'] }}` tool.
  If you want to add some new code at the end of the file, use the `{{ tool_names['insert_after_symbol'] }}` tool with the last top-level symbol in the file. 
  Similarly, you can use `{{ tool_names['insert_before_symbol'] }}` with the first top-level symbol in the file to insert code at the beginning of a file.
  You can understand relationships between symbols by using the `{{ tool_names['find_referencing_symbols'] }}` tool. If not explicitly requested otherwise by the user,
  you make sure that when you edit a symbol, the change is either backward-compatible or you find and update all references as needed.
  The `{{ tool_names['find_referencing_symbols'] }}` tool will give you code snippets around the references as well as symbolic information.
  These edits are reliable: once a tool returns without error the change is applied, so you do not need to re-read the file just to confirm it.

  {% if 'replace_contents' in available_tools %}
  **File-based editing**
  Use `{{ tool_names['replace_contents'] }}` for targeted literal or regex replacements instead of rewriting a whole file.
  {% if 'replace_content' not in available_tools %}
  Pass a `replacements` array, including a one-item array for a single change. Several different replacements
  across known files belong in one call. Entries for the same file are evaluated in input order.
  Use `dry_run` to review changes and `expected_content_sha256` to guard the original text.
  All entries are validated before writing, but multi-file writes are not atomic. Check per-file outcomes
  and verify state before retrying an interrupted or partially applied batch.
  {% endif %}
  In regex mode, use a sufficiently specific pattern; ambiguous matches are rejected.
  {% if 'replace_in_files' in available_tools %}For the SAME replacement across discovered files,
  use `{{ tool_names['replace_in_files'] }}` with a dry-run preview and optional occurrence selection.{% endif %}
  {% endif %}
excluded_tools:
 - replace_lines
 - insert_at_line
 - delete_lines
