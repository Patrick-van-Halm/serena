name: Agent workflow regression tests
on:
  push:
    branches: [feat/agent-workflow-tools, optimizations]
  pull_request:
    branches: [optimizations]
permissions:
  contents: read
concurrency:
  group: agent-workflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra dev
      - name: Formatting and lint
        run: |
          uv run ruff check src/serena/agent_workflow src/serena/tools/batch_*_tools.py test/serena/test_agent_workflow*.py
          uv run ruff format --diff src/serena/agent_workflow src/serena/tools/batch_*_tools.py test/serena/test_agent_workflow*.py
      - name: Type checking
        if: ${{ !cancelled() }}
        run: uv run poe type-check
      - name: Existing MCP and latency regressions
        if: ${{ !cancelled() }}
        run: uv run pytest -q test/serena/test_request_latency.py test/serena/test_mcp_sdk_v2.py test/serena/test_mcp.py test/serena/test_mcp_bridge.py test/serena/test_bridge_recovery.py test/serena/test_raw_file_transport.py test/serena/test_read_file_raw.py test/serena/test_shared_daemon_startup.py test/serena/test_shared_daemon_wsl.py test/serena/test_project_server_port_integration.py test/serena/test_project_server_endpoint.py test/serena/test_daemon_recovery.py test/serena/test_project_server_recovery.py test/serena/test_restart_cli.py --timeout=90 --tb=short --junitxml=mcp-regressions.xml
      - name: Agent workflow regressions
        if: ${{ !cancelled() }}
        run: uv run pytest -q test/serena/test_agent_workflow*.py --timeout=90 --tb=short --junitxml=batch-regressions.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: agent-workflow-tests-${{ matrix.python }}
          path: |
            mcp-regressions.xml
            batch-regressions.xml
