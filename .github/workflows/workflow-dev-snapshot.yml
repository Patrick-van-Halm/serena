name: Workflow development snapshot
on:
  push:
    branches: [feat/agent-workflow-tools]
    paths: [.github/workflows/workflow-dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --locked --extra dev
      - run: |
          git archive --format=tar.gz -o source.tar.gz HEAD
          tar -czf dependencies.tar.gz .venv/lib/python3.13/site-packages .venv/bin/ruff .venv/bin/ty
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-development-source
          path: |
            source.tar.gz
            dependencies.tar.gz
          retention-days: 1
